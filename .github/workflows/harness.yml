name: Harness

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "scripts/check-harness.mjs"
      - ".github/workflows/harness.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "scripts/check-harness.mjs"
      - ".github/workflows/harness.yml"

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/check-harness.mjs
